[project]
name = "discordbot"
version = "0.1.0"
description = "Standalone general-chat Discord bot: LLM + web search/fetch + image/file understanding + outbound GIFs/stickers/files. No Hermes, no terminal access."
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-dotenv>=1.0",
]
